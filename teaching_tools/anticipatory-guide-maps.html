<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anticipatory Guide</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #fff; padding: 30px 20px; }
  .screen-only { text-align: center; margin-bottom: 20px; }
  .screen-only h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .screen-only p { font-size: 12px; color: #888; margin-bottom: 10px; }
  .print-btn { padding: 8px 24px; background: #1a1a2e; color: #fff; border: none; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }
  .page { max-width: 680px; margin: 0 auto; }
  .title { text-align: center; font-size: 16px; font-weight: 800; color: #1a1a2e; margin-bottom: 16px; }
  .meta-line { display: flex; gap: 30px; margin-bottom: 18px; justify-content: center; }
  .meta-field { font-size: 12px; font-weight: 600; color: #555; }
  .meta-blank { display: inline-block; width: 160px; border-bottom: 1px solid #ccc; margin-left: 6px; }
  .meta-blank.wide { width: 200px; }
  table { width: 100%; border-collapse: collapse; border: 2px solid #333; }
  th { border: 2px solid #333; padding: 12px 14px; font-size: 14px; font-weight: 700; color: #333; text-align: center; }
  td { border: 2px solid #333; padding: 14px 14px; vertical-align: top; font-size: 13px; line-height: 1.4; }
  td.statement { font-weight: 600; color: #333; width: 36%; }
  td.check { width: 18%; text-align: center; min-height: 80px; height: 80px; }
  td.explain { width: 28%; min-height: 80px; }
  @media print { body { padding: 0.4in; } .screen-only { display: none; } }
  @page { margin: 0.5in; size: portrait; }
</style>
</head>
<body>
<div class="screen-only">
  <h1>Anticipatory Guide</h1>
  <p>Agree/disagree organizer &mdash; print or save as PDF</p>
  <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
</div>
<div class="page">
  <div class="title">Anticipatory Guide</div>
  <div class="meta-line">
    <div class="meta-field">Name: <span class="meta-blank"></span></div>
    <div class="meta-field">Date: <span class="meta-blank"></span></div>
    <div class="meta-field">Topic: <span class="meta-blank wide"></span></div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Statement</th>
        <th>Agree</th>
        <th>Disagree</th>
        <th>Brief Explanation</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="statement">1.</td>
        <td class="check"></td>
        <td class="check"></td>
        <td class="explain"></td>
      </tr>
      <tr>
        <td class="statement">2.</td>
        <td class="check"></td>
        <td class="check"></td>
        <td class="explain"></td>
      </tr>
      <tr>
        <td class="statement">3.</td>
        <td class="check"></td>
        <td class="check"></td>
        <td class="explain"></td>
      </tr>
      <tr>
        <td class="statement">4.</td>
        <td class="check"></td>
        <td class="check"></td>
        <td class="explain"></td>
      </tr>
      <tr>
        <td class="statement">5.</td>
        <td class="check"></td>
        <td class="check"></td>
        <td class="explain"></td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
