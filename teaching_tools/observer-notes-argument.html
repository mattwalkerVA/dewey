<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Observer Notes &mdash; Argument</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #fff;
    padding: 30px 20px;
  }

  .screen-only { text-align: center; margin-bottom: 20px; }
  .screen-only h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .screen-only p { font-size: 12px; color: #888; margin-bottom: 10px; }
  .print-btn {
    padding: 8px 24px;
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .page { max-width: 680px; margin: 0 auto; }

  .title {
    text-align: center;
    font-size: 16px;
    font-weight: 800;
    color: #1a1a2e;
    margin-bottom: 16px;
  }

  .meta-line {
    display: flex;
    gap: 30px;
    margin-bottom: 18px;
    justify-content: center;
  }
  .meta-field { font-size: 12px; font-weight: 600; color: #555; }
  .meta-blank {
    display: inline-block;
    width: 160px;
    border-bottom: 1px solid #ccc;
    margin-left: 6px;
  }
  .meta-blank.wide { width: 200px; }

  .scale { display: flex; flex-direction: column; align-items: center; }

  .columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    width: 100%;
    margin-bottom: 0;
  }

  .col { display: flex; flex-direction: column; gap: 8px; }

  .claim-label {
    text-align: center;
    font-size: 14px;
    font-weight: 800;
    color: #333;
    margin-bottom: 4px;
  }

  .evidence-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
  }

  .evidence-box {
    border: 2px solid #333;
    border-radius: 4px;
    min-height: 70px;
  }

  .bar-wrap {
    width: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-top: 10px;
  }

  .bar {
    width: 100%;
    height: 28px;
    background: #c0c0c0;
    border-radius: 4px;
  }

  .fulcrum {
    width: 0;
    height: 0;
    border-left: 36px solid transparent;
    border-right: 36px solid transparent;
    border-top: 50px solid #999;
    margin-top: -1px;
  }

  .codes {
    text-align: center;
    font-size: 13px;
    font-weight: 700;
    color: #333;
    margin-top: 18px;
  }

  @media print {
    body { padding: 0.4in; }
    .screen-only { display: none; }
  }
  @page { margin: 0.5in; size: portrait; }
</style>
</head>
<body>

<div class="screen-only">
  <h1>Visual Organizer &mdash; Argument</h1>
  <p>Third observer notes &mdash; print or save as PDF</p>
  <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="page">
  <div class="title">Visual Organizer for Third Observer Notes (Argument)</div>

  <div class="meta-line">
    <div class="meta-field">Name: <span class="meta-blank"></span></div>
    <div class="meta-field">Date: <span class="meta-blank"></span></div>
    <div class="meta-field">Topic: <span class="meta-blank wide"></span></div>
  </div>

  <div class="scale">
    <div class="columns">
      <div class="col">
        <div class="claim-label">Idea/Claim 1</div>
        <div class="evidence-row"><div class="evidence-box"></div><div class="evidence-box"></div></div>
        <div class="evidence-row"><div class="evidence-box"></div><div class="evidence-box"></div></div>
        <div class="evidence-row"><div class="evidence-box"></div><div class="evidence-box"></div></div>
        <div class="evidence-row"><div class="evidence-box"></div><div class="evidence-box"></div></div>
      </div>
      <div class="col">
        <div class="claim-label">Idea/Claim 2</div>
        <div class="evidence-row"><div class="evidence-box"></div><div class="evidence-box"></div></div>
        <div class="evidence-row"><div class="evidence-box"></div><div class="evidence-box"></div></div>
        <div class="evidence-row"><div class="evidence-box"></div><div class="evidence-box"></div></div>
        <div class="evidence-row"><div class="evidence-box"></div><div class="evidence-box"></div></div>
      </div>
    </div>

    <div class="bar-wrap">
      <div class="bar"></div>
      <div class="fulcrum"></div>
    </div>
  </div>

  <div class="codes">Sample Codes: C = Clarify, S = Support, E = Evaluate, V = Value</div>
</div>


</body>
</html>
