<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Building Ideas Visual</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: #fff;
    padding: 30px 20px;
  }

  .screen-only { text-align: center; margin-bottom: 20px; }
  .screen-only h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .screen-only p { font-size: 12px; color: #888; margin-bottom: 10px; }
  .print-btn {
    padding: 8px 24px;
    background: #1a1a2e;
    color: #fff;
    border: none;
    border-radius: 6px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
  }

  .page { max-width: 720px; margin: 0 auto; }

  .title {
    text-align: center;
    font-size: 16px;
    font-weight: 800;
    color: #1a1a2e;
    margin-bottom: 16px;
  }

  .meta-line {
    display: flex;
    gap: 30px;
    margin-bottom: 18px;
    justify-content: center;
  }
  .meta-field { font-size: 12px; font-weight: 600; color: #555; }
  .meta-blank {
    display: inline-block;
    width: 160px;
    border-bottom: 1px solid #ccc;
    margin-left: 6px;
  }
  .meta-blank.wide { width: 200px; }

  .frame {
    border: 2px solid #ccc;
    border-radius: 4px;
    overflow: hidden;
  }

  .idea-bar {
    background: #e8e8e8;
    padding: 14px 24px;
    text-align: center;
    font-size: 15px;
    font-weight: 700;
    color: #333;
    border-bottom: 2px solid #ccc;
  }

  .rows { display: flex; flex-direction: column; }

  .row {
    display: flex;
    min-height: 70px;
    border-bottom: 2px solid #ccc;
  }
  .row:last-child { border-bottom: none; }

  .block {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: #333;
    padding: 10px;
    text-align: center;
    border-right: 2px solid #ccc;
  }
  .block:last-child { border-right: none; }

  .clarify { background: #f5d5c8; }
  .support { background: #d4ece8; }

  @media print {
    body { padding: 0.4in; }
    .screen-only { display: none; }
  }
  @page { margin: 0.5in; size: portrait; }
</style>
</head>
<body>

<div class="screen-only">
  <h1>Building Ideas Visual</h1>
  <p>Blank graphic organizer &mdash; print or save as PDF</p>
  <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="page">
  <div class="title">Building Ideas Visual</div>

  <div class="meta-line">
    <div class="meta-field">Name: <span class="meta-blank"></span></div>
    <div class="meta-field">Date: <span class="meta-blank"></span></div>
    <div class="meta-field">Topic: <span class="meta-blank wide"></span></div>
  </div>

  <div class="frame">
    <div class="idea-bar">IDEA</div>

    <div class="rows">
      <div class="row">
        <div class="block clarify" style="flex:4">Clarify</div>
        <div class="block support" style="flex:3">Support</div>
        <div class="block clarify" style="flex:5">Clarify</div>
      </div>
      <div class="row">
        <div class="block support" style="flex:4">Support</div>
        <div class="block clarify" style="flex:3">Clarify</div>
        <div class="block support" style="flex:5">Support</div>
      </div>
      <div class="row">
        <div class="block support" style="flex:3">Support</div>
        <div class="block clarify" style="flex:3">Clarify</div>
        <div class="block clarify" style="flex:4">Clarify</div>
        <div class="block support" style="flex:3">Support</div>
      </div>
      <div class="row">
        <div class="block clarify" style="flex:2">Clarify</div>
        <div class="block support" style="flex:4">Support</div>
        <div class="block support" style="flex:6">Support</div>
      </div>
      <div class="row">
        <div class="block support" style="flex:5">Support</div>
        <div class="block clarify" style="flex:4">Clarify</div>
        <div class="block clarify" style="flex:3">Clarify</div>
      </div>
    </div>
  </div>
</div>


</body>
</html>
