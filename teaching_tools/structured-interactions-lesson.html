<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Structured Interactions Lesson Plan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: #fff; padding: 30px 20px; }
  .screen-only { text-align: center; margin-bottom: 20px; }
  .screen-only h1 { font-size: 18px; font-weight: 800; margin-bottom: 4px; }
  .screen-only p { font-size: 12px; color: #888; margin-bottom: 10px; }
  .print-btn { padding: 8px 24px; background: #1a1a2e; color: #fff; border: none; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; }
  .page { max-width: 700px; margin: 0 auto; }
  .title { text-align: center; font-size: 16px; font-weight: 800; color: #1a1a2e; margin-bottom: 16px; }
  .meta-line { display: flex; gap: 30px; margin-bottom: 18px; justify-content: center; }
  .meta-field { font-size: 12px; font-weight: 600; color: #555; }
  .meta-blank { display: inline-block; width: 160px; border-bottom: 1px solid #ccc; margin-left: 6px; }
  .meta-blank.wide { width: 200px; }
  table { width: 100%; border-collapse: collapse; border: 2px solid #333; }
  th { border: 2px solid #333; padding: 12px 14px; font-size: 13px; font-weight: 700; color: #333; text-align: center; border-bottom: 3px solid #333; }
  td { border: 1px solid #333; padding: 12px 14px; vertical-align: top; font-size: 12px; line-height: 1.45; color: #333; min-height: 70px; height: 70px; }
  td.moment { font-weight: 700; font-size: 13px; width: 14%; vertical-align: middle; border-right: 2px solid #333; }
  td.task { width: 18%; }
  td.objective { width: 30%; }
  td.interaction { width: 38%; }
  @media print { body { padding: 0.3in; } .screen-only { display: none; } }
  @page { margin: 0.4in; size: portrait; }
</style>
</head>
<body>
<div class="screen-only">
  <h1>Structured Interactions Lesson Plan</h1>
  <p>Lesson framework &mdash; print or save as PDF</p>
  <button class="print-btn" onclick="window.print()">Print / Save as PDF</button>
</div>
<div class="page">
  <div class="title">Structured Interactions Lesson Plan</div>
  <div class="meta-line">
    <div class="meta-field">Name: <span class="meta-blank"></span></div>
    <div class="meta-field">Date: <span class="meta-blank"></span></div>
    <div class="meta-field">Topic: <span class="meta-blank wide"></span></div>
  </div>
  <table>
    <thead>
      <tr>
        <th>Moment</th>
        <th>Task</th>
        <th>Conceptual Objective</th>
        <th>Structured Interactions</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td class="moment" rowspan="2">Preparing</td>
        <td class="task"></td>
        <td class="objective"></td>
        <td class="interaction"></td>
      </tr>
      <tr>
        <td class="task"></td>
        <td class="objective"></td>
        <td class="interaction"></td>
      </tr>
      <tr>
        <td class="moment" rowspan="2">Interacting</td>
        <td class="task"></td>
        <td class="objective"></td>
        <td class="interaction"></td>
      </tr>
      <tr>
        <td class="task"></td>
        <td class="objective"></td>
        <td class="interaction"></td>
      </tr>
      <tr>
        <td class="moment" rowspan="2">Extending</td>
        <td class="task"></td>
        <td class="objective"></td>
        <td class="interaction"></td>
      </tr>
      <tr>
        <td class="task"></td>
        <td class="objective"></td>
        <td class="interaction"></td>
      </tr>
    </tbody>
  </table>
</div>

</body>
</html>
